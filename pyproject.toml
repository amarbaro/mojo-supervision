[project]
name = "mojo-supervision"
version = "0.1.1"
description = "Roboflow supervision ported to Mojo, each op checked against Python supervision"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = ["mojo>=1.2.0,<1.3"]

[tool.mojo]
deps = ["mojo-cv", "mojo-gzip", "mojo-json"]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
