[project]
name = "mojo-supervision"
version = "0.0.0"
description = "Roboflow supervision ported to Mojo, each op checked against Python supervision"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mojo==1.2.0",
    "max==26.7.0",
]

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
